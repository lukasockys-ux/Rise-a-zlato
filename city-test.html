<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Říše a zlato – město, grafický test</title><style>*{box-sizing:border-box}body{margin:0;background:#211e18;color:#f4dfb1;font:15px Georgia,serif}header,footer{padding:12px 20px;background:#30271c}h1{font-size:23px;margin:0}main{display:grid;grid-template-columns:250px 1fr;min-height:80vh}aside{padding:14px;background:#382d20;display:flex;flex-direction:column;gap:8px}button,select{background:#55412a;color:#ffe7b5;border:1px solid #a68a51;border-radius:5px;padding:8px;font:inherit;cursor:pointer}button:hover{background:#79603b}#scene{width:100%;height:auto;max-height:85vh;align-self:center}label{display:flex;justify-content:space-between;align-items:center}#status{font-size:13px}@media(max-width:700px){main{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr}#scene{max-height:none}}</style><header><h1>Říše a zlato · živé město</h1><small>Samostatný grafický prototyp – bez zásahu do hry</small></header><main><aside><label>Kapitol <select id="cap"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Krajina <select id="land"><option value="forest">Les</option><option value="river">Řeka</option><option value="mountain">Hory</option><option value="coast">Pobřeží</option></select></label><label>Hradby <select id="wall"><option>0</option><option>1</option><option>2</option><option>3</option></select></label><select id="type"><option value="house">Dům</option><option value="farm">Farma</option><option value="market">Tržiště</option><option value="barracks">Kasárna</option><option value="mill">Mlýn</option><option value="church">Kostel</option><option value="smith">Kovárna</option><option value="saw">Pila</option></select><button onclick="build()">Postavit budovu</button><button onclick="upgrade()">Vylepšit poslední budovu</button><button onclick="turn()">Další kolo</button><button onclick="reset()">Obnovit město</button><div id="status"></div></aside><svg id="scene" viewBox="0 0 1100 760"></svg></main><footer>Grafický test · budovy se přidávají podle skutečného stavu testovacího města.</footer><script>
const $=id=>document.getElementById(id);let buildings=[],round=1;const names={house:'Dům',farm:'Farma',market:'Tržiště',barracks:'Kasárna',mill:'Mlýn',church:'Kostel',smith:'Kovárna',saw:'Pila'};const P=(x,y,z=0)=>[550+(x-y)*39,170+(x+y)*22-z];const pts=a=>a.map(v=>P(...v).join(',')).join(' ');const poly=(a,c,stroke='#493e2b')=>'<polygon points="'+pts(a)+'" fill="'+c+'" stroke="'+stroke+'" stroke-width="1"/>';const line=(a,b,c,w=2)=>'<path d="M'+P(...a).join(' ')+'L'+P(...b).join(' ')+'" stroke="'+c+'" stroke-width="'+w+'" fill="none"/>';function block(x,y,w,d,h,c='#c7b18b',roof='#85452e'){return poly([[x,y+d,0],[x+w,y+d,0],[x+w,y+d,h],[x,y+d,h]],c)+poly([[x+w,y,0],[x+w,y+d,0],[x+w,y+d,h],[x+w,y,h]],'#88765b')+poly([[x,y,h],[x+w,y,h],[x+w,y+d,h],[x,y+d,h]],roof)}
function house(x,y,w=1.5,d=1.4,h=42,roof='#873f2a'){let s=block(x,y,w,d,h);s+=poly([[x,y,h],[x+w,y,h],[x+w,y+d/2,h+23],[x,y+d/2,h+23]],roof)+poly([[x,y+d,h],[x+w,y+d,h],[x+w,y+d/2,h+23],[x,y+d/2,h+23]],'#a65b38')+poly([[x+w,y,h],[x+w,y+d,h],[x+w,y+d/2,h+23]],'#6c3926');for(let i=.25;i<w-.15;i+=.55)s+=poly([[x+i,y+d+.01,12],[x+i+.22,y+d+.01,12],[x+i+.22,y+d+.01,27],[x+i,y+d+.01,27]],'#382c21');return s}
function tree(x,y,h){let [a,b]=P(x,y);return '<g><ellipse cx="'+a+'" cy="'+b+'" rx="13" ry="6" fill="#26351f" opacity=".5"/><path d="M'+a+' '+b+'v-'+h+'" stroke="#59402a" stroke-width="5"/><path d="M'+a+' '+(b-h-16)+'l-19 35h38Z" fill="#354d2a"/><path d="M'+a+' '+(b-h+3)+'l-24 38h48Z" fill="#476139"/></g>'}
function tower(x,y,h){let s=block(x,y,.8,.8,h,'#b9b29b','#777461');for(let i=0;i<2;i++)s+=block(x+i*.55,y+.65,.25,.25,h+9,'#b9b29b','#a9a28d');return s}
function capitol(l){let x=4.4,y=4.4,s=block(x-.3,y-.3,2.7,2.7,8,'#92866b');s+=house(x,y,2,2,42+l*13,'#753a2c');if(l>1)s+=tower(x+1.6,y+1.5,65+l*12);if(l>2)s+=tower(x-.2,y+1.5,70+l*12);if(l>3)s+=tower(x+1.6,y-.2,80+l*12);if(l>4)s+=tower(x-.2,y-.2,95+l*12);return s}
let slots=[[2,2],[5,1.5],[8,2],[1.5,5],[8,5],[2,8],[5,8],[8,8],[3.5,2],[6.5,2],[2,6.5],[8,6.5],[3.5,8],[6.5,8]];
function drawBuilding(b){let [x,y]=slots[b.slot],s='',h=35+b.level*8;if(b.type==='farm'){s=poly([[x,y,0],[x+1.7,y,0],[x+1.7,y+1.7,0],[x,y+1.7,0]],'#aa9250');for(let i=.1;i<1.7;i+=.22)s+=line([x+i,y,1],[x+i,y+1.7,1],'#66502d',3);s+=house(x,y,.8,.7,24)}else if(b.type==='market'){s=block(x,y,1.6,1.4,18,'#8e6d43','#c9a35b');for(let i=0;i<3;i++)s+=poly([[x+i*.53,y,35],[x+(i+1)*.53,y,35],[x+(i+1)*.53,y+1.4,25],[x+i*.53,y+1.4,25]],i%2?'#e4c78b':'#9e4032')}else if(b.type==='church'){s=house(x,y,1.4,1.7,h,'#555b59')+tower(x+.4,y, h+45);s+=line([x+.8,y+.4,h+45],[x+.8,y+.4,h+63],'#e8c86d',3)}else if(b.type==='barracks'){s=house(x,y,1.7,1.6,h,'#59615a')+tower(x+1.3,y+1.2,h+15)}else if(b.type==='mill'){s=house(x,y,1.1,1.1,h,'#78654b');let a=[x+.55,y+1.12,h+12];for(let i=0;i<4;i++){let t=i*Math.PI/2+.5; s+=line(a,[a[0]+Math.cos(t)*.65,a[1],a[2]+Math.sin(t)*40],'#c9b48a',6)}}else s=house(x,y,1.5,1.4,h,b.type==='smith'?'#484747':b.type==='saw'?'#9b7950':'#914e35');if(b.left){for(let i=0;i<3;i++){let z=i*20;s+=line([x-.12,y+1.7,z],[x+1.8,y+1.7,z],'#d2a368',3)}for(let i=0;i<4;i++)s+=line([x+i*.6-.12,y+1.7,0],[x+i*.6-.12,y+1.7,65],'#ad7740',3);let [a,c]=P(x+.8,y+.8,h+45);s+='<rect x="'+(a-27)+'" y="'+(c-10)+'" width="54" height="18" rx="4" fill="#29251d"/><text x="'+a+'" y="'+(c+3)+'" fill="#ffe5a0" text-anchor="middle" font-size="12">'+(100-b.left*50)+' %</text>'}return s}
function render(){let land=$('land').value,l=+$('cap').value,w=+$('wall').value,s='<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#7c8e85"/><stop offset="1" stop-color="#c5b88b"/></linearGradient><filter id="shadow"><feDropShadow dx="3" dy="6" stdDeviation="3" flood-opacity=".35"/></filter></defs><rect width="1100" height="760" fill="url(#sky)"/>';s+=poly([[-2,-2,0],[13,-2,0],[13,13,0],[-2,13,0]],land==='mountain'?'#7b8063':'#748451','#4c573c');for(let i=-2;i<13;i++)for(let j=-2;j<13;j++){let v=Math.sin(i*12.7+j*8.9);s+=poly([[i,j,0],[i+1,j,0],[i+1,j+1,0],[i,j+1,0]],v>.3?'#82905b':v<-.4?'#687a4b':'#758552','none')}if(land==='river'||land==='coast'){s+=poly([[-2,10,1],[13,10,1],[13,13,1],[-2,13,1]],'#4f8290','none');for(let i=0;i<12;i++)s+=line([i,11,2],[i+.6,11,2],'#a2c4bd',2)}if(land==='mountain')for(let i=0;i<5;i++)s+=poly([[i*2-2,-2,0],[i*2+1,-2,0],[i*2-.5,-2,100+i%2*45]],'#8f8c7d');for(let i=0;i<12;i++){s+=tree(i-1,-1,35+i%3*9);if(i<8)s+=tree(-1,i,38+i%2*12)}s+=poly([[.7,.7,1],[10,.7,1],[10,10,1],[.7,10,1]],'#9c936d','none');for(let i of [3.8,7.2]){s+=poly([[i,1,2],[i+.4,1,2],[i+.4,10,2],[i,10,2]],'#c1b18a','none');s+=poly([[1,i,2],[10,i,2],[10,i+.4,2],[1,i+.4,2]],'#c1b18a','none')}if(w){s+=block(.8,.8,9,.25,w*12,'#b0a58b')+block(.8,.8,.25,9,w*12,'#b0a58b')}let items=buildings.map(b=>({depth:slots[b.slot][0]+slots[b.slot][1],html:drawBuilding(b)}));items.push({depth:10,html:capitol(l)});s+='<g filter="url(#shadow)">'+items.sort((a,b)=>a.depth-b.depth).map(a=>a.html).join('')+'</g>';if(w){s+=block(.8,9.7,9,.25,w*12,'#b0a58b')+block(9.7,.8,.25,9,w*12,'#b0a58b');for(let [x,y] of [[.7,.7],[9.6,.7],[.7,9.6],[9.6,9.6]])s+=tower(x,y,w*12+16)}$('scene').innerHTML=s;$('status').textContent='Kolo '+round+' · '+buildings.length+' budov · '+buildings.filter(b=>b.left).length+' ve výstavbě'}
function build(){let slot=slots.findIndex((_,i)=>!buildings.some(b=>b.slot===i));if(slot<0)return;let type=$('type').value;if(['market','church','barracks','mill','smith'].includes(type)&&buildings.some(b=>b.type===type))return;buildings.push({type,slot,level:1,left:2});render()}function upgrade(){let b=buildings.at(-1);if(b&&!b.left&&b.level<3){b.left=2;b.up=true;render()}}function turn(){round++;for(let b of buildings)if(b.left&&!--b.left&&b.up){b.level++;b.up=false}render()}function reset(){round=1;buildings=[{type:'house',slot:0,level:1,left:0},{type:'farm',slot:3,level:1,left:0}];$('cap').value=1;$('wall').value=0;render()}for(let id of ['cap','land','wall'])$(id).onchange=render;reset();
</script></html>
